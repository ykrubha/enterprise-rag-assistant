[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-assistant"
version = "0.1.0"
description = "Enterprise knowledge assistant: hybrid RAG with citations, FastAPI, and an evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
